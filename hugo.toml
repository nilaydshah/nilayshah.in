    sameAs = [
      "https://www.linkedin.com/in/nilaydshah/",
      "https://x.com/nilaydshah",
      "https://www.instagram.com/nilayshah.in/",
      "https://github.com/nilaydshah",
      "https://theainativeengineer.substack.com/"
    ]

  [params.assets]
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    theme_color = "#0b1f3a"
    msapplication_TileColor = "#0b1f3a"

